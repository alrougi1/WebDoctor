<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="wd-title">
  <title id="wd-title">WebDoctor crimson diagnostic emblem</title>
  <defs>
    <linearGradient id="wd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080d"/>
      <stop offset="1" stop-color="#1b0509"/>
    </linearGradient>
    <linearGradient id="wd-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#8b0018"/>
    </linearGradient>
    <filter id="wd-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="61" fill="url(#wd-bg)" stroke="#3b0a14" stroke-width="2"/>
  <path d="M64 12 108 33v37c0 24-19 40-44 48-25-8-44-24-44-48V33z"
        fill="#0c0c12" stroke="url(#wd-red)" stroke-width="2.5"/>

  <!-- hood -->
  <path d="M39 63c0-23 11-36 25-36s25 13 25 36l-11-7c-2-12-7-18-14-18s-12 6-14 18z"
        fill="#17171f" stroke="#ff2d55" stroke-width="1.4"/>
  <path d="M51 56q13-7 26 0l-4 21q-9 8-18 0z" fill="#040407"/>

  <!-- eyes -->
  <path d="M54 63l8-2-2 5zM74 63l-8-2 2 5z" fill="#ff2d55" filter="url(#wd-glow)"/>

  <!-- crimson scarf -->
  <path d="M47 82q17 11 34 0l6 14q-23 13-46 0z" fill="url(#wd-red)"/>
  <path d="M79 88 106 105 98 114 70 95z" fill="#a30f24" stroke="#ff2d55" stroke-width="1"/>

  <!-- blade -->
  <path d="M64 27 71 79 64 106 57 79z" fill="#e5e7eb" opacity=".92"/>
  <path d="M64 27v79" stroke="#fff" stroke-width="1" opacity=".8"/>
  <path d="M51 79h26" stroke="#ff2d55" stroke-width="3" stroke-linecap="round"/>

  <!-- diagnostic arc -->
  <path d="M45 99c-11-13-9-33 5-41" fill="none" stroke="#ff2d55" stroke-width="2"
        stroke-linecap="round" opacity=".85"/>
  <circle cx="50" cy="58" r="3" fill="#ff2d55" filter="url(#wd-glow)"/>
</svg>
